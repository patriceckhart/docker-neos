Neos:
  Flow:
    persistence:
      backendOptions:
        driver: '%env:DB_DRIVER%'
        charset: '%env:DB_CHARSET%'
        dbname: '%env:DB_DATABASE%'
        user: '%env:DB_USER%'
        password: '%env:DB_PASS%'
        host: '%env:DB_HOST%'
        port: '%env:DB_PORT%'
  Imagine:
    driver: '%env:IMAGINE_DRIVER%'
    enabledDrivers:
      Vips: true
      Gd: true
      Imagick: true